<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../statics/style1.css">
    <title>Forgot Password</title>
    <style>
        .mybg {
            background: #707f85;
        }

        .b-mybg {
            background: #a9d6e5;
        }
    </style>
</head>

<body class="b-mybg" background="/static/assets/img/img-1.png">
    <div class="container w-25 p-5 mt-5 rounded shadow-lg mybg">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger" role="alert">
            {{message}}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form action="/forget_password" method="post">
            <h2>Reset Password</h2>
            <p class="mb-3">Enter the email and mobile number on your account, then set a new password.</p>
            <div class="row mt-3 align-items-center mt-2">
                <div class="col">
                    <input type="email" class="form-control" name="email" id="email" placeholder="enter your email" />
                </div>
            </div>
            <div class="row align-items-center mt-1">
                <div class="col">
                    <input type="text" class="form-control" name="mobile" id="mobile" placeholder="enter your mobile number" />
                </div>
            </div>
            <div class="row align-items-center mt-1">
                <div class="col">
                    <input type="password" class="form-control" name="password" id="password" placeholder="enter new password" />
                </div>
            </div>
            <div class="row align-items-center mt-1">
                <div class="col">
                    <input type="password" class="form-control" name="confirm_password" id="confirm_password" placeholder="confirm new password" />
                </div>
            </div>
            <div>
                <button type="submit" class="btn btn-outline-info mt-3 mb-2"><b>Reset Password</b></button>
            </div>
        </form>
        <div>
            <a class="btn btn-outline-info" href="/user_login"><b>Back to Login</b></a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
